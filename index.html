<style>
  :root{color-scheme:dark;--bg:#070B12;--panel:#101A28;--border:#304259;--text:#E6EDF5;--muted:#AAB8C5;--blue:#2391EB;--cyan:#00BCEB}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

  img{width:128px;height:128px;border-radius:24px}
  h1{margin:16px 0 4px;font-size:clamp(28px,6vw,40px);letter-spacing:.02em}
  p{color:var(--muted);margin:8px 0}
  .card{display:block;margin-top:28px;padding:20px;background:var(--panel);border:1px solid var(--border);border-radius:14px;color:var(--text);text-decoration:none;text-align:left;transition:border-color .2s}
  .card:hover,.card:focus-visible{border-color:var(--cyan);outline:none}
  .card strong{display:block;font-size:18px;color:var(--cyan)}
  .card span{color:var(--muted);font-size:14px}
</style>
